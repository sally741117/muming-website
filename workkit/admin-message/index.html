<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行政訊息助手｜MUMING WorkKit</title>
  <meta name="description" content="行政訊息助手可在純前端產生催交資料、報到通知與會議通知訊息。">
  <style>
    :root {
      --cream: #f8f1e7;
      --paper: #fffaf2;
      --ink: #2f241b;
      --green: #253f32;
      --muted: #725f4c;
      --orange: #d8843f;
      --orange-dark: #b9682b;
      --gold: #c6a15b;
      --line: rgba(47, 36, 27, 0.13);
      --soft: rgba(255, 250, 242, 0.78);
      --shadow: 0 22px 58px rgba(47, 36, 27, 0.11);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink); background: radial-gradient(circle at 0 0, rgba(216,132,63,.13), transparent 32rem), var(--cream); line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    .wrap { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .topbar { padding: 22px 0; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    .brand { display: flex; flex-direction: column; line-height: 1.25; font-weight: 850; color: var(--green); letter-spacing: .04em; }
    .brand small { color: var(--muted); font-size: .78rem; font-weight: 650; }
    .nav-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .pill-link, .btn {
      border: 1px solid var(--line); border-radius: 999px; min-height: 42px; padding: 10px 15px; display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,250,242,.74); color: var(--green); font-weight: 780; cursor: pointer; transition: .2s ease;
    }
    .pill-link:hover, .btn:hover { transform: translateY(-1px); border-color: rgba(216,132,63,.45); color: var(--orange); }
    .hero { padding: 42px 0 28px; }
    .eyebrow { color: var(--orange); font-weight: 850; letter-spacing: .14em; text-transform: uppercase; font-size: .82rem; }
    h1 { margin: 12px 0 12px; color: var(--green); font-size: clamp(2.2rem, 6vw, 4.5rem); line-height: 1; letter-spacing: -.04em; }
    .hero p { max-width: 760px; margin: 0; color: var(--muted); font-size: 1.05rem; }
    .app-shell { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr); gap: 24px; padding: 18px 0 72px; align-items: start; }
    .panel { border: 1px solid var(--line); background: linear-gradient(145deg, rgba(255,250,242,.97), rgba(255,246,232,.84)); border-radius: 28px; box-shadow: var(--shadow); padding: clamp(20px, 3vw, 30px); }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
    .tab { border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px; background: rgba(255,255,255,.38); color: var(--muted); font-weight: 850; cursor: pointer; }
    .tab.active { background: var(--green); color: #fff; border-color: var(--green); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    label, .legend { color: var(--green); font-weight: 800; font-size: .94rem; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 16px; padding: 12px 13px; background: rgba(255,255,255,.74); color: var(--ink); outline: none;
    }
    textarea { min-height: 112px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: rgba(216,132,63,.75); box-shadow: 0 0 0 4px rgba(216,132,63,.12); }
    .checkboxes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 8px 10px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.45); }
    .check input { width: auto; }
    .shared { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .btn.primary { background: var(--orange); color: white; border-color: var(--orange); box-shadow: 0 12px 26px rgba(216,132,63,.24); }
    .btn.primary:hover { background: var(--orange-dark); color: white; }
    .btn.warn { color: var(--orange-dark); }
    .output-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .output-head h2 { margin: 0; color: var(--green); font-size: 1.45rem; }
    .status { color: var(--orange-dark); font-weight: 800; min-height: 1.5em; }
    .message-box { min-height: 420px; white-space: pre-wrap; border: 1px solid var(--line); border-radius: 22px; padding: 18px; background: rgba(255,255,255,.62); color: var(--ink); }
    .notice { margin-top: 16px; padding: 14px 16px; border-radius: 18px; background: rgba(198,161,91,.13); color: var(--muted); border: 1px solid rgba(198,161,91,.25); }
    .hidden { display: none !important; }
    footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); }
    @media (max-width: 880px) {
      .wrap { width: min(100% - 28px, 1180px); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .nav-actions, .pill-link { width: 100%; }
      .app-shell { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: 1fr; }
      .form-grid, .checkboxes { grid-template-columns: 1fr; }
      .actions .btn { width: 100%; }
      .message-box { min-height: 300px; }
    }
  </style>
</head>
<body>
  <header class="wrap topbar">
    <a class="brand" href="../">
      <span>MUMING WorkKit</span>
      <small>行政訊息助手</small>
    </a>
    <nav class="nav-actions" aria-label="頁面連結">
      <a class="pill-link" href="../">返回 WorkKit 工具中心</a>
      <a class="pill-link" href="../../">返回牧茗首頁</a>
    </nav>
  </header>

  <main>
    <section class="wrap hero">
      <div class="eyebrow">Admin Message Assistant</div>
      <h1>行政訊息助手</h1>
      <p>選擇情境、填入必要資訊，就能快速產生催交資料、報到通知與會議通知訊息。所有功能皆在瀏覽器前端運作，不需登入、不串接 API。</p>
    </section>

    <section class="wrap app-shell" aria-label="行政訊息產生器">
      <div class="panel">
        <div class="tabs" role="tablist" aria-label="訊息情境">
          <button class="tab active" type="button" data-tab="reminder">催交資料</button>
          <button class="tab" type="button" data-tab="onboarding">報到通知</button>
          <button class="tab" type="button" data-tab="meeting">會議通知</button>
        </div>

        <form id="messageForm">
          <div class="scenario" data-panel="reminder">
            <div class="form-grid">
              <div class="field"><label for="reminderName">對方稱呼</label><input id="reminderName" placeholder="例如：王小姐、各位同仁"></div>
              <div class="field"><label for="documentName">文件或資料名稱</label><input id="documentName" placeholder="例如：身分證影本、報價資料"></div>
              <div class="field"><label for="deadline">繳交期限</label><input id="deadline" type="date"></div>
              <div class="field"><label for="submitMethod">繳交方式</label><select id="submitMethod"><option>請選擇</option><option>LINE 傳送</option><option>Email 回覆</option><option>紙本繳交</option><option>現場繳交</option><option>公司系統上傳</option><option>雲端連結上傳</option><option>交給指定聯絡人</option><option>其他方式</option></select></div>
              <div class="field"><label for="reminderStage">提醒階段</label><select id="reminderStage"><option>第一次提醒</option><option>第二次提醒</option><option>多次提醒</option><option>最後期限通知</option></select></div>
              <div class="field full"><label for="reminderNote">補充說明</label><textarea id="reminderNote" placeholder="例如：若已繳交請忽略此訊息。"></textarea></div>
            </div>
          </div>

          <div class="scenario hidden" data-panel="onboarding">
            <div class="form-grid">
              <div class="field"><label for="onboardName">對方稱呼</label><input id="onboardName" placeholder="例如：陳先生、李小姐"></div>
              <div class="field"><label for="positionItem">職位或報到事項</label><input id="positionItem" placeholder="例如：行政助理、新人報到"></div>
              <div class="field"><label for="onboardDate">報到日期</label><input id="onboardDate" type="date"></div>
              <div class="field"><label for="onboardTime">報到時間</label><input id="onboardTime" type="time"></div>
              <div class="field full"><label for="onboardPlace">報到地點</label><input id="onboardPlace" placeholder="例如：公司一樓櫃台"></div>
              <div class="field"><label for="contactPerson">聯絡人</label><input id="contactPerson" placeholder="例如：人資林小姐"></div>
              <div class="field full"><span class="legend">攜帶文件勾選</span><div class="checkboxes"><label class="check"><input type="checkbox" name="docs" value="身分證件">身分證件</label><label class="check"><input type="checkbox" name="docs" value="學經歷文件">學經歷文件</label><label class="check"><input type="checkbox" name="docs" value="銀行存摺影本">銀行存摺影本</label><label class="check"><input type="checkbox" name="docs" value="印章">印章</label><label class="check"><input type="checkbox" name="docs" value="照片">照片</label><label class="check"><input type="checkbox" name="docs" value="其他公司指定文件">其他公司指定文件</label></div></div>
              <div class="field full"><label for="dressNote">服裝或其他提醒</label><textarea id="dressNote" placeholder="例如：請穿著整潔服裝，並提前 10 分鐘抵達。"></textarea></div>
            </div>
          </div>

          <div class="scenario hidden" data-panel="meeting">
            <div class="form-grid">
              <div class="field"><label for="meetingName">會議名稱</label><input id="meetingName" placeholder="例如：八月專案進度會議"></div>
              <div class="field"><label for="participants">參加對象</label><input id="participants" placeholder="例如：專案小組、各部門主管"></div>
              <div class="field"><label for="meetingDate">日期</label><input id="meetingDate" type="date"></div>
              <div class="field"><label for="meetingTime">時間</label><input id="meetingTime" type="time"></div>
              <div class="field full"><label for="meetingPlace">地點或線上連結</label><input id="meetingPlace" placeholder="例如：二樓會議室 / Google Meet 連結"></div>
              <div class="field"><label for="needReply">是否需要回覆出席</label><select id="needReply"><option>需要回覆出席</option><option>不需回覆出席</option></select></div>
              <div class="field full"><label for="meetingContent">會議內容</label><textarea id="meetingContent" placeholder="例如：確認工作進度、討論待解決事項。"></textarea></div>
              <div class="field full"><label for="prepareItems">需要準備的資料</label><textarea id="prepareItems" placeholder="例如：請先整理各自負責項目的進度與問題。"></textarea></div>
            </div>
          </div>

          <div class="shared form-grid">
            <div class="field"><label for="audience">訊息對象</label><select id="audience"><option>員工</option><option>主管</option><option>客戶</option><option>廠商</option><option>面試者</option><option>公司群組</option><option>其他</option></select></div>
            <div class="field"><label for="tone">語氣</label><select id="tone"><option>親切自然</option><option>正式專業</option><option>簡短直接</option><option>委婉客氣</option><option>明確提醒</option><option>強硬但有禮貌</option></select></div>
          </div>

          <div class="actions">
            <button class="btn primary" type="button" id="generateBtn">產生行政訊息</button>
            <button class="btn" type="button" id="copyBtn">複製訊息</button>
            <button class="btn" type="button" id="shortenBtn">縮短內容</button>
            <button class="btn" type="button" id="friendlyBtn">改親切一點</button>
            <button class="btn" type="button" id="strongBtn">加強提醒</button>
            <button class="btn warn" type="reset" id="resetBtn">重新填寫</button>
          </div>
        </form>
      </div>

      <aside class="panel">
        <div class="output-head">
          <div><div class="eyebrow">Generated Message</div><h2>產生結果</h2></div>
          <div class="status" id="status" aria-live="polite"></div>
        </div>
        <div class="message-box" id="messageOutput">請先選擇情境並填入資訊，再點選「產生行政訊息」。</div>
        <div class="notice">使用提醒：產生內容僅供行政作業參考，傳送前請確認資料正確。</div>
      </aside>
    </section>
  </main>

  <footer>
    <div class="wrap">© MUMING Management Consulting｜牧茗管理顧問</div>
  </footer>

  <script>
    const state = { scenario: 'reminder', lastMessage: '' };
    const $ = (id) => document.getElementById(id);
    const value = (id) => ($(id)?.value || '').trim();
    const dateText = (id) => value(id) || '指定日期';
    const timeText = (id) => value(id) || '指定時間';
    const lines = (...items) => items.filter(Boolean).join('\n');

    function setStatus(text) {
      $('status').textContent = text;
      if (text) window.setTimeout(() => { if ($('status').textContent === text) $('status').textContent = ''; }, 2200);
    }

    function applyTone(message, tone) {
      const closing = {
        '親切自然': '謝謝你的協助，有任何問題也歡迎直接回覆我。',
        '正式專業': '以上再請協助確認，謝謝。',
        '簡短直接': '請協助確認，謝謝。',
        '委婉客氣': '若方便的話，再麻煩您協助確認，謝謝您。',
        '明確提醒': '請務必留意期限並協助完成，謝謝。',
        '強硬但有禮貌': '此事項已接近或達到期限，請優先處理並回覆完成狀況，謝謝。'
      };
      if (tone === '簡短直接') return message.replace(/您好[，,]?\n?/, '').replace(/再麻煩您/g, '請').trim() + '\n\n' + closing[tone];
      return message.trim() + '\n\n' + closing[tone];
    }

    function audiencePrefix() {
      const target = value('audience') || '員工';
      if (target === '公司群組') return '各位好：';
      if (target === '主管') return '主管您好：';
      if (target === '客戶' || target === '廠商') return '您好：';
      return '您好：';
    }

    function generateReminder() {
      const name = value('reminderName') || '您好';
      const doc = value('documentName') || '相關資料';
      const method = value('submitMethod');
      const methodText = method && method !== '請選擇' ? `繳交方式：${method}` : '繳交方式：請依原先約定方式提供';
      const stage = value('reminderStage') || '第一次提醒';
      const note = value('reminderNote');
      return lines(
        `${name}您好：`,
        `這邊提醒您，${doc}尚待提供。`,
        `提醒階段：${stage}`,
        `繳交期限：${dateText('deadline')}`,
        methodText,
        note ? `補充說明：${note}` : '',
        '再麻煩您協助於期限前完成提供。'
      );
    }

    function generateOnboarding() {
      const name = value('onboardName') || '您好';
      const docs = Array.from(document.querySelectorAll('input[name="docs"]:checked')).map(item => item.value);
      return lines(
        `${name}您好：`,
        `通知您關於${value('positionItem') || '報到事項'}的安排如下。`,
        `報到日期：${dateText('onboardDate')}`,
        `報到時間：${timeText('onboardTime')}`,
        `報到地點：${value('onboardPlace') || '指定地點'}`,
        `聯絡人：${value('contactPerson') || '現場聯絡窗口'}`,
        docs.length ? `請攜帶文件：${docs.join('、')}` : '',
        value('dressNote') ? `服裝或其他提醒：${value('dressNote')}` : '',
        '請您依上述時間與地點準時報到。'
      );
    }

    function generateMeeting() {
      const prefix = audiencePrefix();
      const reply = value('needReply') || '需要回覆出席';
      return lines(
        prefix,
        `通知${value('participants') || '相關同仁'}參加「${value('meetingName') || '會議'}」。`,
        `日期：${dateText('meetingDate')}`,
        `時間：${timeText('meetingTime')}`,
        `地點或線上連結：${value('meetingPlace') || '指定地點或連結'}`,
        `出席回覆：${reply}`,
        value('meetingContent') ? `會議內容：${value('meetingContent')}` : '',
        value('prepareItems') ? `需要準備的資料：${value('prepareItems')}` : '',
        reply === '需要回覆出席' ? '請協助回覆是否可以出席。' : '請依時間準時參加。'
      );
    }

    function generateMessage() {
      let message = '';
      if (state.scenario === 'reminder') message = generateReminder();
      if (state.scenario === 'onboarding') message = generateOnboarding();
      if (state.scenario === 'meeting') message = generateMeeting();
      state.lastMessage = applyTone(message, value('tone') || '親切自然');
      $('messageOutput').textContent = state.lastMessage;
      setStatus('已產生');
    }

    function ensureMessage() {
      if (!state.lastMessage) generateMessage();
      return state.lastMessage;
    }

    async function copyMessage() {
      const text = ensureMessage();
      try {
        await navigator.clipboard.writeText(text);
      } catch (error) {
        const area = document.createElement('textarea');
        area.value = text; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove();
      }
      setStatus('已複製');
    }

    function shortenMessage() {
      const text = ensureMessage();
      const compact = text.split('\n').filter(line => !line.startsWith('補充說明：') || line.length < 36).slice(0, 7).join('\n');
      state.lastMessage = compact + '\n\n請協助確認，謝謝。';
      $('messageOutput').textContent = state.lastMessage;
      setStatus('已縮短');
    }

    function makeFriendly() {
      const text = ensureMessage().replace(/請務必/g, '也請記得').replace(/優先處理/g, '撥空協助處理').replace(/請協助/g, '再麻煩協助');
      state.lastMessage = text + '\n\n辛苦了，謝謝你的幫忙。';
      $('messageOutput').textContent = state.lastMessage;
      setStatus('已調整語氣');
    }

    function makeStronger() {
      const text = ensureMessage();
      state.lastMessage = text + '\n\n提醒您，為避免影響後續行政作業，請於期限前完成並回覆處理狀況。';
      $('messageOutput').textContent = state.lastMessage;
      setStatus('已加強提醒');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.scenario = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(item => item.classList.toggle('active', item === tab));
        document.querySelectorAll('.scenario').forEach(panel => panel.classList.toggle('hidden', panel.dataset.panel !== state.scenario));
        setStatus('已切換情境');
      });
    });

    $('generateBtn').addEventListener('click', generateMessage);
    $('copyBtn').addEventListener('click', copyMessage);
    $('shortenBtn').addEventListener('click', shortenMessage);
    $('friendlyBtn').addEventListener('click', makeFriendly);
    $('strongBtn').addEventListener('click', makeStronger);
    $('resetBtn').addEventListener('click', () => {
      window.setTimeout(() => {
        state.lastMessage = '';
        $('messageOutput').textContent = '請先選擇情境並填入資訊，再點選「產生行政訊息」。';
        setStatus('已重新填寫');
      }, 0);
    });
  </script>
</body>
</html>
